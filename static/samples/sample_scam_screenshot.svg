<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Phone Screen Frame / Background -->
  <rect width="600" height="400" fill="#f8fafc" rx="16"/>

  <!-- Mobile Status Bar -->
  <rect x="0" y="0" width="600" height="40" fill="#ffffff"/>
  <text x="24" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">9:41 AM</text>
  <text x="530" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">LTE  100%</text>

  <!-- App Header -->
  <rect x="0" y="40" width="600" height="64" fill="#ffffff" filter="url(#shadow)"/>
  <line x1="0" y1="104" x2="600" y2="104" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Back arrow & Avatar -->
  <path d="M 28 72 L 38 62 M 28 72 L 38 82" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="68" cy="72" r="20" fill="#e0e7ff"/>
  <text x="68" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" fill="#4338ca">🏦</text>

  <!-- Sender Details -->
  <text x="100" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">GTBank-Alert</text>
  <circle cx="204" cy="64" r="6" fill="#2563eb"/>
  <path d="M 201 64 L 203 66 L 207 62" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <text x="100" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">SMS • Short Code 30012</text>

  <!-- Timestamp pill -->
  <rect x="250" y="125" width="100" height="24" rx="12" fill="#e2e8f0"/>
  <text x="300" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Today 10:42 AM</text>

  <!-- Incoming Scam Message Bubble -->
  <rect x="28" y="165" width="544" height="180" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- SMS Content Lines -->
  <text x="48" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#dc2626">GTBank Security Notice:</text>
  <text x="48" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#1e293b">Your bank account has been suspended due to unverified BVN details.</text>
  <text x="48" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#1e293b">Kindly verify your BVN and OTP within 24 hours at:</text>
  <text x="48" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#2563eb" text-decoration="underline">https://gtb-update-portal.xyz/login</text>
  <text x="48" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#1e293b">Failure to update will result in permanent account deactivation.</text>

  <!-- Timestamp inside bubble -->
  <text x="550" y="332" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">10:42 AM</text>
</svg>
